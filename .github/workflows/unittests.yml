name: "Unittests"
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ ubuntu-latest ]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the Unit Tests
        env:
          PYTHONPATH: src
        run: |
          uv run --locked --group tests pytest
