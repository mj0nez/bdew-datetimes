name: "Linters"

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

env:
  UV_LOCKED: true

jobs:
  linters:
    name: Python Code Quality and Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      matrix:
        linter-env: ["linting", "type_check", "spell_check"]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.1
        with:
          python-version: "3.15"
      - name: Run linting
        if: matrix.linter-env == 'linting'
        run: |
          make lint
      - name: Run type_check
        if: matrix.linter-env == 'type_check'
        run: |
          make typing
      - name: Run spell_check
        if: matrix.linter-env == 'spell_check'
        run: |
          make spell-check
