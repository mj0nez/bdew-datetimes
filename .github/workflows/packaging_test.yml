name: "Packaging Test"

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

env:
  UV_LOCKED: true

jobs:
  test_packaging:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build the package
        run: |
          make build
      - name: Check the built distributions
        run: |
          make build-check
