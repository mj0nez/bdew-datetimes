name: "Black"

on:
  pull_request:
  push:
    branches:
      - main
jobs:
  black:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tool: ["black", "isort"]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
      - name: ${{ matrix.tool }} Code Formatter
        run: |
          uv run --locked --group formatting ${{ matrix.tool }} . --check
