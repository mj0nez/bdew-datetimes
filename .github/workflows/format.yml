name: "Format"

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

env:
  UV_LOCKED: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.15"
      - name: ruff ci-format
        run: |
          make ci-format
