[project]
name = "bdew_datetimes"
description = "Generate and work with holidays of the BDEW-Calendar for power and gas in Germany"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Marcel Johannesmann", email = "mj0nez@fn.de" },
    { name = "Konstantin Klein" },
]
keywords = ["bdew", "edi@energy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "holidays>=0.84;python_version>='3.10'",
    "pytz>=2022.7.1",
    "python-dateutil",
]
dynamic = ["readme", "version"]

[project.urls]
Changelog = "https://github.com/mj0nez/bdew-datetimes/releases"
Homepage = "https://github.com/mj0nez/bdew-datetimes/"

[build-system]
requires = ["hatchling>=1.8.0", "hatch-vcs", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[dependency-groups]
tests = ["pytest==9.1.1", "syrupy==5.5.3"]
linting = ["ruff==0.16.2"]
type_check = [
    "mypy==2.3.0",
    "types-python-dateutil==2.9.0.20260716",
    "types-pytz==2026.3.1.20260727",
    { include-group = "tests" },
]
spell_check = ["codespell==2.4.3"]
dev = [
    { include-group = "tests" },
    { include-group = "linting" },
    { include-group = "type_check" },
    { include-group = "spell_check" },
]

[tool.uv]
default-groups = []

[tool.ruff]
line-length = 79
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "N",   # pep8-naming
    "PL",  # pylint
    "RUF", # ruff-specific rules
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "PTH", # flake8-use-pathlib
    "PT",  # flake8-pytest-style
    "RET", # flake8-return
    "ARG", # flake8-unused-arguments
    "TC",  # flake8-type-checking
    "PIE", # flake8-pie
    "RSE", # flake8-raise
    "ISC", # flake8-implicit-str-concat
    "S",   # flake8-bandit (published library)
]
ignore = [
    "PLR0913", # too-many-arguments
    "PLR0917", # too-many-positional-arguments
    "PLR0912", # too-many-branches
    "PLR0915", # too-many-statements
    "PLR2004", # magic-value-comparison
    "ISC001",  # single-line-implicit-string-concatenation (conflicts with formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["bdew_datetimes"]

[tool.ruff.lint.per-file-ignores]
# Standing globs (hand-written): apply to files that may not exist yet.
"tests/**" = [
    "S101",    # assert-used
    "PLR2004", # magic-value-comparison
]
# Generated grandfathering of pre-existing violations (zero lint churn on
# existing code). New/changed code is held to the full select set above.
"src/bdew_datetimes/__init__.py" = [
    "E501",   # line-too-long
    "RUF022", # unsorted-dunder-all
]
"src/bdew_datetimes/calendar.py" = [
    "E501", # line-too-long
]
"src/bdew_datetimes/enums.py" = [
    "E501",   # line-too-long
    "RUF022", # unsorted-dunder-all
]
"src/bdew_datetimes/german_strom_and_gas_tag.py" = [
    "E501",  # line-too-long
    "UP035", # deprecated-import
]
"src/bdew_datetimes/models.py" = [
    "E501",  # line-too-long
    "UP007", # non-pep604-annotation-union
]
"src/bdew_datetimes/periods.py" = [
    "E501",   # line-too-long
    "RUF022", # unsorted-dunder-all
    "UP045",  # non-pep604-annotation-optional
]
"src/bdew_datetimes/utils.py" = [
    "E501",   # line-too-long
    "RUF022", # unsorted-dunder-all
]
"tests/test_calendar.py" = [
    "PT006", # pytest-parametrize-names-wrong-type
]
"tests/test_german_strom_and_gas_tag.py" = [
    "PT006", # pytest-parametrize-names-wrong-type
]
"tests/test_period.py" = [
    "E501",  # line-too-long
    "PT006", # pytest-parametrize-names-wrong-type
    "PT011", # pytest-raises-too-broad
]

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{ path = "README.md" }]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/_bdew_datetimes_version.py"
template = '''
version = "{version}"
'''

[tool.hatch.build.targets.sdist]
exclude = ["tests"]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["snapshot: mark a test as a snapshot test"]
