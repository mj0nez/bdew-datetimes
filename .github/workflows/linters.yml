name: "Linters"

on:
  pull_request:
  push:
    branches:
      - main
jobs:
  pylint:
    name: Python Code Quality and Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        linter-env: ["linting", "type_check", "spell_check"]
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
      - name: Run linting
        if: matrix.linter-env == 'linting'
        run: |
          uv run --locked --group linting pylint bdew_datetimes
      - name: Run type_check
        if: matrix.linter-env == 'type_check'
        run: |
          uv run --locked --group type_check mypy --show-error-codes --strict src/bdew_datetimes
          uv run --locked --group type_check mypy --show-error-codes --strict tests
      - name: Run spell_check
        if: matrix.linter-env == 'spell_check'
        run: |
          uv run --locked --group spell_check codespell --ignore-words=domain-specific-terms.txt src/bdew_datetimes
          uv run --locked --group spell_check codespell --ignore-words=domain-specific-terms.txt README.md
